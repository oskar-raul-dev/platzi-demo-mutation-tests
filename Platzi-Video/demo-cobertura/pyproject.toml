[project]
name = "demo-cobertura"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pytest==8.4.2", "pytest-cov==7.0.0", "mutmut==3.3.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
branch = false

[tool.mutmut]
paths_to_mutate = ["carrito.py"]
tests_dir = ["tests/"]

